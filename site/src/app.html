<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#131210" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/icon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			// Apply the saved or system theme before the first paint.
			(function () {
				try {
					var pref = localStorage.getItem('theme');
					var light = pref === 'light' || (pref !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
					document.documentElement.dataset.theme = light ? 'light' : 'dark';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
